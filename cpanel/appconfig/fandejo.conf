# AppConfig configuration file for Fandejo Database Workbench
# Installs to: /var/cpanel/apps/fandejo.conf
# Registered via: /usr/local/cpanel/bin/register_appconfig

# Service that hosts the application (cpanel end-user interface)
service=cpanel

# Run scripts under the logged-in cPanel tenant user
user=$authuser

# URL path mapping relative to the cPanel webroot (must be within /3rdparty/ for cPanel plugins)
url=/3rdparty/fandejo/index.live.php

# WHM Feature Manager ACL key required to access
acls=fandejo

# User-facing application name
displayname=Fandejo Database Workbench

# Target frame (_self or _blank)
target=_self

# Entry script path for direct execution
entryurl=3rdparty/fandejo/index.live.php
